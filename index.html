<!doctype html>
<html lang="en">
<head><script src="./js/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f6f3"><title>ScriptForge · Your screenplays</title><link rel="stylesheet" href="./css/editor.css"><link rel="stylesheet" href="./css/home.css"><link rel="stylesheet" href="./css/layout.css"><link rel="stylesheet" href="./css/voice-library.css"><script src="./js/launch.js" defer></script><script type="module" src="./js/startup.js" data-entry="home"></script><link rel="stylesheet" href="./css/theme.css"><link rel="stylesheet" href="./css/screenplay-format.css"><link rel="stylesheet" href="./css/writing-statistics.css"></head>
<body class="library">
  <header class="library-header"><img class="brand-logo" src="./scriptForgeLogo.png" width="44" height="44" alt="" aria-hidden="true"><div class="library-wordmark">ScriptForge<small>FORGE STUDIOS</small></div></header>
  <main class="library-main">
    <section class="library-intro"><h1>YOUR SCREENPLAYS</h1><div class="library-actions"><button id="open-fountain" disabled class="secondary-button">Import Fountain File</button><button id="new-screenplay" disabled class="primary-button">＋ New Screenplay</button></div></section>
    <div id="library-error" class="library-error" role="alert" hidden></div><a id="memory-editor" class="memory-editor" href="./editor.html?new=1" hidden>Open a new editor without browser recovery →</a>
    <div class="library-controls"><span id="library-count" class="library-count"></span><button id="writing-statistics" class="quiet-button">Writing Statistics</button><button id="voice-library" class="quiet-button">Voice Library</button><label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search your screenplays" aria-label="Search screenplays"></label></div>
    <section id="script-grid" class="script-grid" aria-label="Recent screenplays"></section>
    <section id="empty-state" class="empty-state" hidden><h2 id="empty-title"></h2><p id="empty-text"></p><button id="sample-script" class="sample-link">Explore a sample screenplay →</button></section>
  </main>
  <dialog id="delete-script-dialog"><h1>Delete from the library?</h1><p id="delete-script-description"></p><p class="dialog-note">You can undo this removal. Any original files and exported copies stay on your computer.</p><div class="dialog-actions"><button id="cancel-delete-script" class="secondary-button">Cancel</button><button id="confirm-delete-script" class="primary-button">Delete</button></div></dialog>
  <div id="library-notice" class="notice" role="status" hidden><span id="library-notice-message"></span><button id="undo-delete-script" hidden>Undo</button></div>
</body>
</html>
