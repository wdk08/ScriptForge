name: Publish verified v1.0.1 artifacts
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ScriptForge v1.0.1 to publish the exact already validated a25cc9d artifacts'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scriptforge-official-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'wdk08/ScriptForge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: wdk08/ScriptForge
      RELEASE_VERSION: 1.0.1
      APP_COMMIT: a25cc9dcc89a8acf0301fa303a324e94a3413942
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast workflow regression tests
        run: node --test tests/release-attachments.test.js
      - name: Require same-commit validation and accessible writable draft before downloading artifacts
        id: preflight
        uses: actions/github-script@v7
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            if(process.env.CONFIRMATION !== 'ScriptForge v1.0.1') throw new Error('Publication approval mismatch.');
            const api=require('./scripts/release-attachments.cjs');
            const {data:workflow}=await github.rest.actions.getWorkflow({...context.repo,workflow_id:'release.yml'});
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:39461403293});
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:run.id,filter:'latest',per_page:100});
            api.verifyRun(run,jobs,workflow.id,process.env.APP_COMMIT);
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:run.id,per_page:100});
            for(const name of ['corresponding-source','installers-aarch64-apple-darwin','installers-x86_64-apple-darwin','installers-x86_64-pc-windows-msvc']) {
              const matches=artifacts.filter(a=>a.name===name&&!a.expired);
              if(matches.length!==1||!matches[0].size_in_bytes)throw new Error(`Missing/ambiguous artifact: ${name}`);
            }
            const release=await api.ensureDraft(github,context.repo,{version:'1.0.1',commit:process.env.APP_COMMIT,refresh:true,body:require('fs').readFileSync('releases/v1.0.1.md','utf8')});
            api.assertDraft(release,'1.0.1',process.env.APP_COMMIT);
            await api.probeAttachment(github,context.repo,release,'1.0.1',`${context.runId}-${context.runAttempt}`);
            core.setOutput('release_id',String(release.id));
      - uses: actions/download-artifact@v4
        with:
          run-id: 39461403293
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: installers-*
          path: verified-artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: 39461403293
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: corresponding-source
          path: verified-artifacts/corresponding-source
      - name: Verify original checksums, corresponding-source commit and signed updater metadata
        run: node scripts/prepare-verified-release.mjs verified-artifacts release-upload
      - name: Attach verified source first, then identical signed binaries and updater metadata by release ID
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.preflight.outputs.release_id }}
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const api=require('./scripts/release-attachments.cjs');
            const plan=JSON.parse(fs.readFileSync('release-upload/upload-plan.json'));
            const id=Number(process.env.RELEASE_ID),version=process.env.RELEASE_VERSION,commit=process.env.APP_COMMIT;
            const {data:release}=await github.rest.repos.getRelease({...context.repo,release_id:id});api.assertDraft(release,version,commit);
            const old=await github.paginate(github.rest.repos.listReleaseAssets,{...context.repo,release_id:id});
            for(const asset of old)await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:asset.id});
            const names=[...plan.source,...plan.packages,...plan.metadata];
            for(const group of [plan.source,plan.packages,plan.metadata])await api.uploadFiles(github,context.repo,{id,version,commit,files:group.map(n=>`release-upload/${n}`)});
            const assets=await github.paginate(github.rest.repos.listReleaseAssets,{...context.repo,release_id:id});
            if(assets.length!==names.length)throw new Error('Unexpected release asset count.');
            for(const name of names){
              const asset=assets.find(a=>a.name===name),bytes=fs.readFileSync(`release-upload/${name}`);
              if(!asset||asset.size!==bytes.length||asset.digest!==`sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`)throw new Error(`Uploaded bytes mismatch: ${name}`);
            }
            require('./scripts/release-attachments.cjs').assertDraft((await github.rest.repos.getRelease({...context.repo,release_id:id})).data,version,commit);
            await import(`${process.env.GITHUB_WORKSPACE}/scripts/validate-update-manifest.mjs`).then(m=>m.validateManifest(JSON.parse(fs.readFileSync('release-upload/latest.json')),version,assets));
            fs.writeFileSync('release-assets.json',JSON.stringify(assets));
      - name: Publish only the exact verified v1.0.1 draft
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.preflight.outputs.release_id }}
        with:
          script: |
            const id=Number(process.env.RELEASE_ID);
            require('./scripts/release-attachments.cjs').assertDraft((await github.rest.repos.getRelease({...context.repo,release_id:id})).data,'1.0.1',process.env.APP_COMMIT);
            await github.rest.repos.updateRelease({...context.repo,release_id:id,tag_name:'v1.0.1',target_commitish:process.env.APP_COMMIT,draft:false,make_latest:'true'});
      - name: Verify public updater discovery and platform downloads
        run: |
          curl --fail --retry 4 --retry-delay 5 --location 'https://github.com/wdk08/ScriptForge/releases/latest/download/latest.json' --output public-latest.json
          node scripts/validate-update-manifest.mjs public-latest.json release-assets.json --public
