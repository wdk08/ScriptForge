name: Official release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, matching source metadata (first release: 1.0.0)'
        required: true
        type: string
      commit:
        description: 'Full reviewed main commit SHA (40 characters)'
        required: true
        type: string
      license_reviewed:
        description: 'I have resolved bundled eSpeak NG redistribution/licensing obligations'
        required: true
        default: false
        type: boolean
      publish:
        description: 'Publish after all checks pass (off creates a nonpublic draft)'
        required: true
        default: false
        type: boolean
      refresh_draft:
        description: 'Replace all assets only on an existing unpublished draft (never a published release)'
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'For publishing, type ScriptForge vX.Y.Z exactly'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: scriptforge-official-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'wdk08/ScriptForge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fast workflow dependency and attachment regression tests
        run: node --test tests/release-attachments.test.js
      - name: Check inputs, draft identity and real attachment permissions before native validation
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          REFRESH: ${{ inputs.refresh_draft }}
          LICENSE_REVIEWED: ${{ inputs.license_reviewed }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const fs = require('node:fs');
            const version = process.env.VERSION, commit = process.env.COMMIT;
            if (commit !== context.sha || JSON.parse(fs.readFileSync('package.json')).version !== version || process.env.LICENSE_REVIEWED !== 'true') throw new Error('Exact commit, version and licensing approval are required.');
            if (process.env.PUBLISH === 'true' && process.env.CONFIRMATION !== `ScriptForge v${version}`) throw new Error('Publication confirmation mismatch.');
            const api = require('./scripts/release-attachments.cjs');
            const release = await api.ensureDraft(github, context.repo, {version,commit,refresh:process.env.REFRESH === 'true',body:fs.readFileSync(`releases/v${version}.md`,'utf8')});
            await api.probeTagPermissions(github, context.repo, commit, `${context.runId}-${context.runAttempt}`);
            await api.probeAttachment(github, context.repo, release, version, `${context.runId}-${context.runAttempt}`);
  validation:
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.repository == 'wdk08/ScriptForge'
    uses: ./.github/workflows/validate-desktop.yml
    with:
      commit: ${{ inputs.commit }}
    secrets: inherit
  review:
    needs: validation
    if: github.ref == 'refs/heads/main' && github.repository == 'wdk08/ScriptForge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      LICENSE_REVIEWED: ${{ inputs.license_reviewed }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run licenses:check
      - name: Validate reviewed commit and approval inputs
        run: |
          node --input-type=module <<'JS'
          if (!/^[a-f0-9]{40}$/.test(process.env.RELEASE_COMMIT) || process.env.RELEASE_COMMIT !== process.env.GITHUB_SHA) throw new Error('Dispatch from the exact reviewed main HEAD.');
          if (process.env.LICENSE_REVIEWED !== 'true') throw new Error('Licensing review is required before uploading artifacts.');
          if (process.env.PUBLISH === 'true' && process.env.RELEASE_CONFIRMATION !== `ScriptForge v${process.env.RELEASE_VERSION}`) throw new Error('Publication confirmation does not match.');
          JS
      - run: npm run release:check -- --production
      - run: npm run audit:history
      - run: npm run audit:public
      - run: npm test
      - run: npm run check
      - run: npm run build:desktop
      - name: Chrome regression suite
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --workers=2 --config=playwright.ci.config.js
  draft:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create or explicitly refresh an unpublished draft; never overwrite a published release or tag
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REFRESH_DRAFT: ${{ inputs.refresh_draft }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION, tag = `v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find(r => r.tag_name === tag);
            if (existing && (!existing.draft || existing.prerelease || (process.env.REFRESH_DRAFT !== 'true' && existing.target_commitish !== context.sha))) throw new Error('Only an explicitly approved unpublished stable draft can be refreshed.');
            try { await github.rest.git.getRef({...context.repo, ref:`tags/${tag}`}); throw new Error('Tag already exists.'); } catch (error) { if (error.status !== 404) throw error; }
            if (!releases.some(r => !r.draft && !r.prerelease) && version !== '1.0.0') throw new Error('The first public release must be 1.0.0.');
            const body = require('fs').readFileSync(`releases/v${version}.md`, 'utf8');
            if (existing) {
              // Clear every outdated asset before fresh source/packages/metadata are uploaded.
              const {data: current} = await github.rest.repos.getRelease({...context.repo, release_id:existing.id});
              if (!current.draft) throw new Error('Release was published; refusing to replace assets.');
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id:existing.id});
              for (const asset of assets) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id:asset.id});
            }
            const options = {...context.repo, tag_name:tag, target_commitish:context.sha, name:`ScriptForge v${version}`, body, draft:true, prerelease:false};
            const {data} = existing
              ? await github.rest.repos.updateRelease({...options, release_id:existing.id})
              : await github.rest.repos.createRelease({...options, tag_name:tag});
            const {data:readback} = await github.rest.repos.getRelease({...context.repo, release_id:data.id});
            require('./scripts/release-attachments.cjs').assertDraft(readback, version, context.sha);
            core.setOutput('release_id', String(data.id));
  source:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: wdk08/ScriptForge
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: corresponding-source
          path: dist/source
      - name: Attach corresponding source to the verified release ID before any installer
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        with:
          script: |
            await require('./scripts/release-attachments.cjs').uploadFiles(github, context.repo, {
              id:process.env.RELEASE_ID,version:process.env.RELEASE_VERSION,commit:context.sha,
              files:[`dist/source/ScriptForge-${process.env.RELEASE_VERSION}-source.tar.gz`,`dist/source/ScriptForge-${process.env.RELEASE_VERSION}-source.tar.gz.sha256`]
            });
  build:
    needs: [draft, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      assets: ${{ steps.attach.outputs.assets }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      APP_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: verified-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: corresponding-source
          path: verified-artifacts/corresponding-source
      - name: Prepare exactly the signed packages exercised by installed-update validation
        run: node scripts/prepare-verified-release.mjs verified-artifacts release-upload
      - name: Attach verified packages and bind updater URLs to uploaded asset IDs
        id: attach
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        with:
          script: |
            const fs=require('node:fs'), crypto=require('node:crypto');
            const api=require('./scripts/release-attachments.cjs');
            const plan=JSON.parse(fs.readFileSync('release-upload/upload-plan.json'));
            if(plan.commit!==context.sha || plan.version!==process.env.RELEASE_VERSION) throw new Error('Artifact plan identity mismatch.');
            const options={id:process.env.RELEASE_ID,version:plan.version,commit:context.sha,reuse:true};
            await api.uploadFiles(github, context.repo, {...options,files:plan.packages.map(n=>`release-upload/${n}`)});
            let assets=await github.paginate(github.rest.repos.listReleaseAssets,{...context.repo,release_id:Number(options.id)});
            const manifestApi=await import(`${process.env.GITHUB_WORKSPACE}/scripts/validate-update-manifest.mjs`);
            const bound=manifestApi.bindManifestToAssets(JSON.parse(fs.readFileSync('release-upload/latest.json')),plan.version,assets);
            fs.writeFileSync('release-upload/latest.json',JSON.stringify(bound,null,2)+'\n');
            await api.uploadFiles(github,context.repo,{...options,replaceMetadata:true,files:['release-upload/latest.json']});
            assets=await github.paginate(github.rest.repos.listReleaseAssets,{...context.repo,release_id:Number(options.id)});
            const expected=[...plan.source,...plan.packages,...plan.metadata];
            if(assets.length!==expected.length)throw new Error('Unexpected release asset set.');
            for(const name of expected){
              const bytes=fs.readFileSync(`release-upload/${name}`),matches=assets.filter(a=>a.name===name);
              const digest='sha256:'+crypto.createHash('sha256').update(bytes).digest('hex');
              if(matches.length!==1||matches[0].size!==bytes.length||matches[0].digest!==digest||matches[0].state!=='uploaded')throw new Error(`Uploaded asset bytes mismatch: ${name}`);
            }
            manifestApi.validateManifest(bound,plan.version,assets);
            core.setOutput('assets',JSON.stringify(assets.map(({id,name,size,digest})=>({id,name,size,digest}))));
  finish:
    needs: [draft, source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: wdk08/ScriptForge
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all three platform signatures and asset references before publication
        uses: actions/github-script@v7
        env:
          VERIFIED_ASSETS: ${{ needs.build.outputs.assets }}
        with:
          script: |
            const fs=require('node:fs');
            const assets=await github.paginate(github.rest.repos.listReleaseAssets,{...context.repo,release_id:Number(process.env.RELEASE_ID)});
            const expected=JSON.parse(process.env.VERIFIED_ASSETS);
            if(assets.length!==expected.length||expected.length!==16)throw new Error('Missing/extra release assets.');
            for(const item of expected){const a=assets.find(a=>a.id===item.id);if(!a||a.name!==item.name||a.size!==item.size||a.digest!==item.digest||a.state!=='uploaded')throw new Error(`Asset changed after verification: ${item.name}`);}
            fs.writeFileSync('release-assets.json',JSON.stringify(assets));
            const metadata=assets.find(a=>a.name==='latest.json');
            const {data}=await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}',{...context.repo,asset_id:metadata.id,headers:{accept:'application/octet-stream'}});
            const bytes=Buffer.from(data);
            if('sha256:'+require('node:crypto').createHash('sha256').update(bytes).digest('hex')!==metadata.digest)throw new Error('Manifest download digest mismatch.');
            const manifestApi=await import(`${process.env.GITHUB_WORKSPACE}/scripts/validate-update-manifest.mjs`);
            manifestApi.validateManifest(JSON.parse(bytes.toString()),process.env.RELEASE_VERSION,assets);
      - name: Publish only after explicit dispatch approval
        if: inputs.publish
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/release-attachments.cjs').publishDraft(github,context.repo,{id:process.env.RELEASE_ID,version:process.env.RELEASE_VERSION,commit:context.sha});
      - name: Verify public discovery and asset downloads
        if: inputs.publish
        run: |
          curl --fail --retry 4 --retry-delay 5 --location 'https://github.com/wdk08/ScriptForge/releases/latest/download/latest.json' --output public-latest.json
          node scripts/validate-update-manifest.mjs public-latest.json release-assets.json --public
      - name: Report release state
        if: always()
        run: |
          echo 'Review the draft/published release and workflow results in GitHub. Failed builds never pass the publication job.' >> "$GITHUB_STEP_SUMMARY"
