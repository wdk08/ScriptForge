[package]
name = "scriptforge"
version = "1.1.0"
description = "ScriptForge local screenplay editor"
authors = ["wdk08"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "scriptforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri-plugin-updater = "2"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
base64 = "0.22"
